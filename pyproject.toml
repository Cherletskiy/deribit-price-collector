[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "deribit-price-collector"
version = "0.1.0"
description = "Market data ingestion service for Deribit index prices."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.12.1",
    "asyncpg==0.29.0",
    "celery[redis]==5.3.6",
    "fastapi==0.104.1",
    "httpx==0.24.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "python-dotenv==1.0.0",
    "sqlalchemy==2.0.23",
    "uvicorn==0.24.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.19.0",
    "mypy>=1.17.0",
    "pre-commit>=4.2.0",
    "pytest==7.4.3",
    "pytest-cov>=4.0.0",
    "ruff>=0.12.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app", "collector"]
omit = [
    "*/__init__.py",
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "collector"]

[tool.mypy]
python_version = "3.12"
pretty = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
files = ["app", "collector"]

[[tool.mypy.overrides]]
module = ["celery"]
ignore_missing_imports = true
